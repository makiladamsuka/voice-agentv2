services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voice-agent-backend
    ports:
      - "8080:8080"
    volumes:
      # Mount known_faces for development convenience
      - ./backend/known_faces:/app/known_faces
      # Mount assets directories for development convenience
      - ./backend/assets:/app/assets
    environment:
      # LiveKit credentials - can be overridden via .env file
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
    restart: unless-stopped
    privileged: true
    devices:
      - "/dev/i2c-1:/dev/i2c-1"
    networks:
      - voice-agent-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - LIVEKIT_URL=${LIVEKIT_URL}
        - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
        - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
        - AGENT_NAME=${AGENT_NAME:-campus-greeting-agent}
        - NEXT_PUBLIC_APP_CONFIG_ENDPOINT=${NEXT_PUBLIC_APP_CONFIG_ENDPOINT}
        - SANDBOX_ID=${SANDBOX_ID}
    container_name: voice-agent-frontend
    ports:
      - "3000:3000"
    volumes:
      # Mount the backend directory to access map data and assets
      - ./backend:/backend
    environment:
      # LiveKit credentials - can be overridden via .env file
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - AGENT_NAME=${AGENT_NAME:-campus-greeting-agent}
      - NEXT_PUBLIC_APP_CONFIG_ENDPOINT=${NEXT_PUBLIC_APP_CONFIG_ENDPOINT:-}
      - SANDBOX_ID=${SANDBOX_ID:-}
      # Path to the backend directory inside the container
      - BACKEND_DIR=/backend
      # Internal backend URL for API communications inside Docker network
      - BACKEND_INTERNAL_URL=http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - voice-agent-network

networks:
  voice-agent-network:
    driver: bridge
